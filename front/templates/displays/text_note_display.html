{% load custom_tags display_tags %}
<div>
    <div class="border rounded p-2">{{ text_note.content|urlize|linebreaksbr }}</div>
    <div>Ajouté le {{ text_note.created_at|date:"d F Y à H:i" }}</div>
    {% if request|is_staff %}
        <a class="text-muted small" href="{% url 'admin:attaching_textnote_change' text_note.uuid %}" target="_blank">
            - Admin <i class="fas fa-up-right-from-square"></i>
        </a>
        {% if text_note_moderation %}
            <a href="{{ text_note_moderation|get_url }}" target="_blank">
                {% display_status_badge text_note_moderation.status %}
            </a>
        {% endif %}
    {% endif %}
</div>
